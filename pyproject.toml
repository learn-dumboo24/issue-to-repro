[project]
name = "issue-to-repro"
version = "0.5.0"
description = "Turns GitHub bug reports into verified failing tests for maintainers. ADK + Gemini + Cloud Run."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "google-adk>=2.14.1",
    "google-genai>=2.34.0",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
issue-to-repro = "issue_to_repro:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term -m 'not docker'"
markers = ["docker: integration tests that start real containers (run with -m docker)"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true


[tool.coverage.run]
source = ["issue_to_repro"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
