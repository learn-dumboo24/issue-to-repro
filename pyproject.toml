[project]
name = "issue-to-repro"
version = "0.1.0"
description = "Turns GitHub bug reports into verified failing tests for maintainers. ADK + Gemini + Cloud Run."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.14.1",
    "google-genai>=2.34.0",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
issue-to-repro = "issue_to_repro:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
