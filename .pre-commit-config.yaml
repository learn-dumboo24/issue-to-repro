# Install once with: uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # keep in step with ruff in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      # Run outputs and frozen issue texts are evidence: keep them byte-for-byte as produced.
      - id: end-of-file-fixer
        exclude: ^(results/|demo/issues\.md$)
      - id: trailing-whitespace
        exclude: ^(results/|demo/issues\.md$)
